<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Moved — Surky Perk Optimizer</title>
  <meta http-equiv="refresh" content="0; url=../surky/">
  <link rel="canonical" href="../surky/">
  <meta name="robots" content="noindex">
  <script>
    (function () {
      try {
        var target = "../surky/" + (window.location.search || "") + (window.location.hash || "");

        window.location.href = "../surky/";

  </script>
  <style>

    body {
      margin: 0;

      color: #e8ecf4;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: #14171f;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 24px 28px;
      max-width: 420px;
    }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; color: #98a2b3; margin: 0 0 16px; }
    a {
      display: inline-block;
      padding: 9px 16px;
      border-radius: 9px;
      background: #f7931a;
      color: #1a1000;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
