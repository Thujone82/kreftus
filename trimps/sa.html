<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting to Spire Assault Planner…</title>
  <link rel="canonical" href="https://kreft.us/assault/">
  <meta http-equiv="refresh" content="0; url=../assault/">
  <script>
    (function () {
      var target = new URL('../assault/', window.location.href);
      target.search = window.location.search;
      target.hash = window.location.hash;
      window.location.replace(target.toString());
    })();
  </script>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b0e14;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      padding: 20px 24px;
      border-radius: 12px;
      background: #121722;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    h1 { margin: 0 0 8px; font-size: 16px; }
    p { margin: 0 0 14px; font-size: 13px; color: #94a3b8; }
    a {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 8px;
      background: #f7931a;
      color: #0b0e14;
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
    }
    a:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Spire Assault Planner has moved</h1>
    <p>Redirecting you from <code>/trimps/sa.html</code> to <code>/assault/</code>…</p>
    <a href="../assault/">Open Spire Assault Planner</a>
  </div>
</body>
</html>
