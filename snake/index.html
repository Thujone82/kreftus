<!--
    Snake VS - A Multiplayer and AI Snake Game
    Version: 1.5

    Game Description:
    Snake VS is a modern take on the classic snake game, offering multiple game modes
    for single-player and multiplayer experiences. Players control a snake, aiming to
    eat food to grow longer while avoiding collisions with themselves, other snakes,
    or (in some modes) the boundaries.

    Game Modes:
    1. VS AI: Player 1 (P1) competes against an AI-controlled snake.
    2. 2 Player (2P): Two human players compete on the same device (WASD vs Arrows / Split Touch).
    3. Battle Royale: Player 1 (P1) competes against 5 AI-controlled snakes.

    v1.5 Improvements:
    - Fixed AI Type 3 (Player Avoider) collision safety inversion bug.
    - Input buffering queue for P1 & P2 (eliminates dropped turns during fast maneuvers).
    - Prevented default arrow key & WASD browser window scrolling.
    - Added In-Game HUD: real-time level, food progress, alive snake count, speed gauge.
    - Web Audio API procedural sound synthesizer (eat, die, level up, button clicks) + haptics.
    - Mobile ergonomic enhancements: on-screen Pause button, touch-action: none, optional touch D-Pad.
    - Boundary coordinate clamping during window resize to prevent off-grid desync.
    - Settings panel: toggle Wall Mode (Wrap-around vs Solid lethal walls), Audio, Touch D-Pad.
    - LocalStorage persistence for wins, losses, win streaks, and high score rankings.
    - Visual polish: snake directional eyes, rounded segment styling, death particle burst.
    - Post-match Start button and mode switcher: choose a mode without automatically starting until ready.
-->

    <script>
        // --- PWA Service Worker Registration ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registered with scope:', reg.scope))
                    .catch(error => console.error('Service Worker registration failed:', error));
            });
        }

        console.log("SnakeVS Script: Loaded and Running v1.5");

        // --- Utility Functions ---
        function clamp(val, min, max) { return Math.min(Math.max(val, min), max); }

        function hslToHex(h, s, l) { 
            s /= 100; l /= 100;
            const k = n => (n + h / 30) % 12;
            const a = s * Math.min(l, 1 - l);
            const f_hsl = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
            const toHex = x => Math.round(x * 255).toString(16).padStart(2, '0');
            return `#${toHex(f_hsl(0))}${toHex(f_hsl(8))}${toHex(f_hsl(4))}`;
        }

        function generateSnakeColors(count = 2) { 
            const colors = [];
            let baseHue = Math.random() * 360;
            const saturation = 100; const lightness = 60;
            const hueStep = 360 / Math.max(count, 3); 
            for (let i = 0; i < count; i++) {
                const hue = (baseHue + i * hueStep + (Math.random() * (hueStep / 2) - (hueStep / 4))) % 360; 
                colors.push(hslToHex(hue, saturation, lightness));
            }
            return colors;
        }

        function hexToRgb(hex){ 
            if (!hex || typeof hex !== 'string' || hex.length < 4) { return {r:0, g:0, b:0}; } 
            const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
            return {r, g, b};
        }

        // --- Persistent Stats & Settings ---
        const STATS_KEY = 'snake_vs_stats_v1';
        const SETTINGS_KEY = 'snake_vs_settings_v1';

        let gameStats = {
            vsAiWins: 0,
            vsAiLosses: 0,
            currentAiStreak: 0,
            bestAiStreak: 0,
            p2P1Wins: 0,
            p2P2Wins: 0,
            battleTotal: 0,
            battleWins: 0,
            bestBattleRank: null,
            longestSnake: 0
        };

        let gameSettings = {
            wallMode: 'wrap', // 'wrap' or 'solid'
            soundEnabled: true,
            showDpad: false
        };

        function loadStatsAndSettings() {
            try {
                const savedStats = localStorage.getItem(STATS_KEY);
                if (savedStats) gameStats = { ...gameStats, ...JSON.parse(savedStats) };
            } catch (e) { console.warn("Failed to load stats:", e); }

            try {
                const savedSettings = localStorage.getItem(SETTINGS_KEY);
                if (savedSettings) gameSettings = { ...gameSettings, ...JSON.parse(savedSettings) };
            } catch (e) { console.warn("Failed to load settings:", e); }
        }

        function saveStats() {
            try { localStorage.setItem(STATS_KEY, JSON.stringify(gameStats)); } catch (e) {}
        }

        function saveSettings() {
            try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(gameSettings)); } catch (e) {}
        }

        loadStatsAndSettings();

        // --- Web Audio API Procedural Synthesizer ---
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) audioCtx = new AudioContextClass();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!gameSettings.soundEnabled) return;
            initAudio();
            if (!audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                if (type === 'eat') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.1);
                    if (navigator.vibrate) navigator.vibrate(25);
                } else if (type === 'die') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(260, now);
                    osc.frequency.exponentialRampToValueAtTime(45, now + 0.32);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.32);
                    if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
                } else if (type === 'level') {
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        const noteStart = now + (idx * 0.07);
                        osc.frequency.setValueAtTime(freq, noteStart);
                        gain.gain.setValueAtTime(0.2, noteStart);
                        gain.gain.exponentialRampToValueAtTime(0.001, noteStart + 0.14);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(noteStart);
                        osc.stop(noteStart + 0.14);
                    });
                } else if (type === 'click') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(950, now);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.04);
                } else if (type === 'pause') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(500, now);
                    osc.frequency.setValueAtTime(400, now + 0.06);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.12);
                }
            } catch (err) {

        // --- Particle System for Game Juice ---
        let particles = [];
        function spawnExplosion(gridX, gridY, color, count = 20) {
            const centerX = gridX * gridSize + gridSize / 2;
            const centerY = gridY * gridSize + gridSize / 2;
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4.5 + 1.2;
                particles.push({
                    x: centerX,
                    y: centerY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: color,
                    alpha: 1.0,
                    decay: Math.random() * 0.035 + 0.02,
                    size: Math.random() * (gridSize * 0.35) + 2
                });
            }
        }

        function updateAndDrawParticles() {
            if (particles.length === 0) return;
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.94;
                p.vy *= 0.94;
                p.alpha -= p.decay;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function queueDirection(playerIndex, dx, dy) {
            const snake = snakes[playerIndex];
            if (!snake || !snake.isAlive) return;

            const queue = (playerIndex === 0) ? p1InputQueue : p2InputQueue;
            if (queue.length >= 2) return; // Buffer up to 2 future moves

            // Determine reference direction (last queued direction or current snake direction)
            const refDir = queue.length > 0 ? queue[queue.length - 1] : { dx: snake.dx, dy: snake.dy };

            // Reject 180-degree turns and exact duplicates
            if (dx === -refDir.dx && dy === -refDir.dy) return;
            if (dx === refDir.dx && dy === refDir.dy) return;

            queue.push({ dx, dy });
        }

        function showBattleStartAnimation(cb) {

            const p1Color = (snakes[0] && snakes[0].color) ? snakes[0].color : '#FFFFFF'; 
            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const progress = Math.min((timestamp - startTime) / duration, 1);
                if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height); 
                const bgY = -canvas.height * progress;
                if (ctx) ctx.fillStyle = p1Color; 
                if (ctx) ctx.fillRect(0, bgY, canvas.width, canvas.height);
                const textFadeStart = 0.2; const textFadeEnd = 0.8; let textAlpha = 0;
                if (progress > textFadeStart && progress < textFadeEnd) {
                    textAlpha = Math.min(1, (progress - textFadeStart) / 0.3, (textFadeEnd - progress) / 0.3);
                }
                if (ctx) {
                    ctx.font = `bold ${clamp(canvas.width * 0.1, 24, 100)}px Arial`; 
                    ctx.textAlign = 'center';
                    ctx.fillStyle = `rgba(255, 255, 255, ${textAlpha})`; 
                    ctx.fillText("BATTLE ROYALE", canvas.width / 2, canvas.height / 2);
                }
                if (progress < 1) requestAnimationFrame(animate); 
                else if (cb) cb();
            } 
            requestAnimationFrame(animate);
        }

        function show2PStartAnimation(cb) { 
            let startTime = null; 
            const duration = 1000; 
            const pipRadius = Math.min(canvas.width, canvas.height) * 0.04; 
            const pipOffset = pipRadius * 2.5; 
            const p1Color = (snakes[0] && snakes[0].color) ? snakes[0].color : '#00FFEA';
            const p2Color = (snakes[1] && snakes[1].color) ? snakes[1].color : '#FF69B4';
            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const progress = Math.min((timestamp - startTime) / duration, 1);
                if (ctx) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height); 
                    ctx.fillStyle = '#0f0f1a'; 
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    const p1RectCurrentY = canvas.height / 2 + (canvas.height / 2) * progress;
                    ctx.fillStyle = p1Color; 
                    ctx.fillRect(0, p1RectCurrentY, canvas.width, canvas.height / 2);
                    ctx.fillStyle = p2Color; 
                    ctx.beginPath();
                    ctx.arc(canvas.width / 2, p1RectCurrentY + (canvas.height / 4), pipRadius, 0, Math.PI * 2); 
                    ctx.fill();
                    const p2RectCurrentY = -(canvas.height / 2) * progress;
                    ctx.fillStyle = p2Color; 
                    ctx.fillRect(0, p2RectCurrentY, canvas.width, canvas.height / 2);
                    ctx.fillStyle = p1Color; 
                    ctx.beginPath();
                    ctx.arc(canvas.width / 2 - pipOffset, p2RectCurrentY + (canvas.height / 4), pipRadius, 0, Math.PI * 2); 
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(canvas.width / 2 + pipOffset, p2RectCurrentY + (canvas.height / 4), pipRadius, 0, Math.PI * 2); 
                    ctx.fill();
                }
                if (progress < 1) requestAnimationFrame(animate); 
                else if (cb) cb();
            } 
            requestAnimationFrame(animate);
        }

        function gameLoop() { 
            try {
                if (isPaused) return; 
                if (!snakes || snakes.length === 0) { 
                    if (gameInterval) clearInterval(gameInterval); 
                    return; 
                }

                let aliveSnakes = snakes.filter(s => s && s.isAlive);
                if (currentGameMode === 'BATTLE') {
                    if (snakes[0] && !snakes[0].isAlive && aliveSnakes.length > 0 && exitBattleButton && exitBattleButton.style.display === 'none') {
                        exitBattleButton.style.display = 'block';
                    }
                    if (aliveSnakes.length <= 1) { endGame(); return; }
                } else { 
                    if (aliveSnakes.length < 2) { endGame(); return; } 
                }

                // Update movement
                const snakesToUpdate = snakes.filter(s => s && s.isAlive);
                snakesToUpdate.forEach(snake => { 
                    if (snake && snake.isAlive) updateSnake(snake); 
                });

                // Check collisions
                const snakesAfterUpdate = snakes.filter(s => s && s.isAlive);
                snakesAfterUpdate.forEach(snake => {
                    if (snake && snake.isAlive) {
                        checkCollisions(snake, snakesAfterUpdate.filter(other => other !== snake && other.isAlive));
                    }
                });

                aliveSnakes = snakes.filter(s => s && s.isAlive); 
                updateHud();

                if (currentGameMode === 'BATTLE') {
                    if (aliveSnakes.length <= 1) { endGame(); return; }
                    if (snakes[0] && !snakes[0].isAlive && aliveSnakes.length > 0 && exitBattleButton && exitBattleButton.style.display === 'none') {
                        exitBattleButton.style.display = 'block';
                    }
                } else { 
                    if (aliveSnakes.length < 2) { endGame(); return; } 
                }

                drawGame();
            } catch (error) { 
                console.error("CRITICAL ERROR in gameLoop:", error); 
                if (gameInterval) clearInterval(gameInterval); 
            }
        }

        function levelUp() { 
            currentLevel++; 
            foodCollectedForLevelUp = 0; 
            gameSpeed = Math.round(gameSpeed * LEVEL_SPEED_INCREASE_FACTOR); 
            if (gameInterval) clearInterval(gameInterval); 
            gameInterval = setInterval(gameLoop, gameSpeed);
            const newFoodColor = levelFoodColors[(currentLevel - 1) % levelFoodColors.length];
            foods.forEach(food => food.color = newFoodColor);
            playSound('level');
        }

        function updateSnake(snake) { 
            try {
                if (!snake || !snake.body || !snake.body[0]) { 
                    if (snake) snake.isAlive = false; 
                    return; 
                }

                // Pull next buffered input for player snakes
                if (snake === snakes[0] && p1InputQueue.length > 0) {
                    const nextDir = p1InputQueue.shift();
                    snake.dx = nextDir.dx;
                    snake.dy = nextDir.dy;
                } else if (snake === snakes[1] && currentGameMode === '2P' && p2InputQueue.length > 0) {
                    const nextDir = p2InputQueue.shift();
                    snake.dx = nextDir.dx;
                    snake.dy = nextDir.dy;
                }

                // AI Decision making
                if (snake.aiType && (currentGameMode === 'BATTLE' || (currentGameMode === 'AI' && snake === snakes[1]))) {
                    snake.decisionDelay++;
                    if (snake.decisionDelay >= snake.decisionThreshold) { 
                        snake.decisionDelay = 0; 
                        decideAIMove(snake, snakes.filter(s => s && s.isAlive)); 
                    }
                }

                let head = { x: snake.body[0].x + snake.dx, y: snake.body[0].y + snake.dy };

                // Handle Wall Mode
                if (gameSettings.wallMode === 'solid') {
                    if (head.x < 0 || head.x >= tileCountX || head.y < 0 || head.y >= tileCountY) {
                        snake.isAlive = false;
                        snake.finalLength = snake.body.length;
                        spawnExplosion(snake.body[0].x, snake.body[0].y, snake.color, 24);
                        playSound('die');
                        if (currentGameMode === 'BATTLE') convertToFood(snake);
                        return;
                    }
                } else {
                    // Wrap-around mode
                    if (head.x < 0) head.x = tileCountX - 1; 
                    else if (head.x >= tileCountX) head.x = 0;
                    if (head.y < 0) head.y = tileCountY - 1; 
                    else if (head.y >= tileCountY) head.y = 0;
                }

                snake.body.unshift(head);

                const eatenFoodIndex = foods.findIndex(f => head.x === f.x && head.y === f.y);
                if (eatenFoodIndex > -1) {
                    foods.splice(eatenFoodIndex, 1); 
                    foodCollectedForLevelUp++;
                    playSound('eat');

                    if (snake.body.length > gameStats.longestSnake) {
                        gameStats.longestSnake = snake.body.length;
                        saveStats();
                    }

                    if (foodCollectedForLevelUp >= FOOD_PER_LEVEL) levelUp();
                    if (snake.aiType === 3) { snake.committedTargetFood = null; } 
                    if (snake.aiType) { snake.movesWithoutEating = 0; snake.turnHistory = []; }
                    placeNewFoodItem(); 
                } else { 
                    snake.body.pop(); 
                    if (snake.aiType) snake.movesWithoutEating++; 
                }
            } catch (error) { 
                console.error("Error in updateSnake:", error); 
                if (snake) snake.isAlive = false; 
            }
        }

        function getTurnType(prevDir, currentDirSuggestion) { 
            if (!prevDir || (prevDir.dx === 0 && prevDir.dy === 0)) return 'U'; 
            if (currentDirSuggestion.dx === prevDir.dx && currentDirSuggestion.dy === prevDir.dy) return 'F'; 
            if (currentDirSuggestion.dx === -prevDir.dx && currentDirSuggestion.dy === -prevDir.dy) return 'B'; 
            const crossProduct = (prevDir.dx * currentDirSuggestion.dy) - (prevDir.dy * currentDirSuggestion.dx);
            if (crossProduct === 1 || 
                (prevDir.dx === 0 && prevDir.dy === 1 && currentDirSuggestion.dx === 1) || 
                (prevDir.dx === 0 && prevDir.dy === -1 && currentDirSuggestion.dx === -1) || 
                (prevDir.dx === 1 && prevDir.dy === 0 && currentDirSuggestion.dy === -1) || 
                (prevDir.dx === -1 && prevDir.dy === 0 && currentDirSuggestion.dy === 1)) return 'L';
            if (crossProduct === -1 || 
                (prevDir.dx === 0 && prevDir.dy === 1 && currentDirSuggestion.dx === -1) || 
                (prevDir.dx === 0 && prevDir.dy === -1 && currentDirSuggestion.dx === 1) || 
                (prevDir.dx === 1 && prevDir.dy === 0 && currentDirSuggestion.dy === 1) || 
                (prevDir.dx === -1 && prevDir.dy === 0 && currentDirSuggestion.dy === -1)) return 'R';
            return 'U';
        }

        function decideAIMove(aiSnakeObject, otherAliveSnakes) { 
            const head = aiSnakeObject.body[0];
            let currentTargetFood = null; 
            
            if (foods.length === 0) { 
                aiSnakeObject.dx = aiSnakeObject.lastDirection.dx; 
                aiSnakeObject.dy = aiSnakeObject.lastDirection.dy; 
                return; 
            }

            if (aiSnakeObject.aiType === 3) {
                let committedTargetStillExists = false;
                if (aiSnakeObject.committedTargetFood) {
                    for (const foodItem of foods) {
                        if (foodItem.x === aiSnakeObject.committedTargetFood.x && foodItem.y === aiSnakeObject.committedTargetFood.y) {
                            committedTargetStillExists = true; 
                            currentTargetFood = foodItem; 
                            break;
                        }
                    }
                }
                if (!committedTargetStillExists) { 
                    aiSnakeObject.committedTargetFood = null; 
                    let maxDistance = -1;
                    foods.forEach(f => { 
                        let dX = Math.abs(head.x - f.x); 
                        if (gameSettings.wallMode === 'wrap' && dX > tileCountX / 2) dX = tileCountX - dX; 
                        let dY = Math.abs(head.y - f.y); 
                        if (gameSettings.wallMode === 'wrap' && dY > tileCountY / 2) dY = tileCountY - dY; 
                        const dist = dX + dY; 
                        if (dist > maxDistance) { maxDistance = dist; currentTargetFood = f; } 
                    });
                    if (currentTargetFood) aiSnakeObject.committedTargetFood = { ...currentTargetFood }; 
                }
            } else { 
                let minDistance = Infinity;
                foods.forEach(f => { 
                    let dX = Math.abs(head.x - f.x); 
                    if (gameSettings.wallMode === 'wrap' && dX > tileCountX / 2) dX = tileCountX - dX; 
                    let dY = Math.abs(head.y - f.y); 
                    if (gameSettings.wallMode === 'wrap' && dY > tileCountY / 2) dY = tileCountY - dY; 
                    const dist = dX + dY; 
                    if (dist < minDistance) { minDistance = dist; currentTargetFood = f; } 
                });
            }

            if (!currentTargetFood) { 
                aiSnakeObject.dx = aiSnakeObject.lastDirection.dx; 
                aiSnakeObject.dy = aiSnakeObject.lastDirection.dy; 
                return; 
            }
            if (!aiSnakeObject.lastFoodTarget || aiSnakeObject.lastFoodTarget.x !== currentTargetFood.x || aiSnakeObject.lastFoodTarget.y !== currentTargetFood.y) { 
                aiSnakeObject.turnHistory = []; 
                aiSnakeObject.lastFoodTarget = { ...currentTargetFood }; 
            } 
            
            const potentialMoves = [ { dx: 0, dy: -1 }, { dx: 0, dy: 1 }, { dx: -1, dy: 0 }, { dx: 1, dy: 0 } ];
            let safeMoves = [];

            for (const move of potentialMoves) {
                if ((aiSnakeObject.dx === -move.dx && aiSnakeObject.dx !== 0) || (aiSnakeObject.dy === -move.dy && aiSnakeObject.dy !== 0)) continue; 
                const nextX = head.x + move.dx; 
                const nextY = head.y + move.dy;

                // Solid Wall check
                if (gameSettings.wallMode === 'solid') {
                    if (nextX < 0 || nextX >= tileCountX || nextY < 0 || nextY >= tileCountY) {
                        continue; // Wall is lethal
                    }
                }

                let checkX = nextX; 
                if (gameSettings.wallMode === 'wrap') {
                    if (checkX < 0) checkX = tileCountX - 1; else if (checkX >= tileCountX) checkX = 0;
                }
                let checkY = nextY; 
                if (gameSettings.wallMode === 'wrap') {
                    if (checkY < 0) checkY = tileCountY - 1; else if (checkY >= tileCountY) checkY = 0;
                }

                // Self-collision safety
                let isSafe = true;
                for (let i = 0; i < aiSnakeObject.body.length; i++) { 
                    if (checkX === aiSnakeObject.body[i].x && checkY === aiSnakeObject.body[i].y) { 
                        isSafe = false; 
                        break; 
                    } 
                }
                if (!isSafe) continue; 
                
                // Other snakes collision safety (ALWAYS check all snakes, including P1!)
                for (const otherSnake of otherAliveSnakes) { 
                    if (otherSnake === aiSnakeObject) continue; 
                    for (const segment of otherSnake.body) { 
                        if (checkX === segment.x && checkY === segment.y) { 
                            isSafe = false; 
                            break; 
                        } 
                    } 
                    if (!isSafe) break; 
                }
                if (!isSafe) continue;

                // Proximity safety buffer for erratic and biased snakes
                if (isSafe && (aiSnakeObject.aiType === 5)) {
                    for (const otherSnake of otherAliveSnakes) {
                        if (otherSnake === aiSnakeObject) continue;
                        for (const segment of otherSnake.body) {
                            let dX_seg = Math.abs(checkX - segment.x);
                            if (gameSettings.wallMode === 'wrap' && dX_seg > tileCountX / 2) dX_seg = tileCountX - dX_seg;
                            let dY_seg = Math.abs(checkY - segment.y);
                            if (gameSettings.wallMode === 'wrap' && dY_seg > tileCountY / 2) dY_seg = tileCountY - dY_seg;
                            if (dX_seg <= 1 && dY_seg <= 1) { 
                                isSafe = false; 
                                break; 
                            }
                        }
                        if (!isSafe) break;
                    }
                }
                if (!isSafe) continue;
                
                // Weight calculation for move
                let currentWeight = 1; 
                if (checkX === currentTargetFood.x && checkY === currentTargetFood.y) { 
                    currentWeight += 20000; 
                } else { 
                    if (head.x === currentTargetFood.x && Math.abs(head.y - currentTargetFood.y) === 1) { 
                        if (move.dy === (currentTargetFood.y - head.y) && move.dx === 0) currentWeight += 15000; 
                    } else if (head.y === currentTargetFood.y && Math.abs(head.x - currentTargetFood.x) === 1) { 
                        if (move.dx === (currentTargetFood.x - head.x) && move.dy === 0) currentWeight += 15000; 
                    } else if (head.x === currentTargetFood.x && move.dx === 0) { 
                        if ((currentTargetFood.y > head.y && move.dy === 1) || (currentTargetFood.y < head.y && move.dy === -1)) currentWeight += 5000; 
                    } else if (head.y === currentTargetFood.y && move.dy === 0) { 
                        if ((currentTargetFood.x > head.x && move.dx === 1) || (currentTargetFood.x < head.x && move.dx === -1)) currentWeight += 5000; 
                    } else if (head.x !== currentTargetFood.x && head.y !== currentTargetFood.y) { 
                        if (checkX === currentTargetFood.x && move.dx !== 0) currentWeight += 2000; 
                        if (checkY === currentTargetFood.y && move.dy !== 0) currentWeight += 2000; 
                    }
                    if (aiSnakeObject.aiType !== 3) { 
                        let dX_w = Math.abs(checkX - currentTargetFood.x); 
                        if (gameSettings.wallMode === 'wrap' && dX_w > tileCountX / 2) dX_w = tileCountX - dX_w;
                        let dY_w = Math.abs(checkY - currentTargetFood.y); 
                        if (gameSettings.wallMode === 'wrap' && dY_w > tileCountY / 2) dY_w = tileCountY - dY_w;
                        currentWeight += Math.max(0, Math.floor((tileCountX + tileCountY) / 4) - (dX_w + dY_w)); 
                    }
                } 

                // Type 3 Player Avoider: apply repulsion penalty when close to a long human player
                if (aiSnakeObject.aiType === 3 && snakes[0] && snakes[0].isAlive && snakes[0].body && snakes[0].body.length > 5) {
                    const p1Head = snakes[0].body[0];
                    let dX_p1 = Math.abs(checkX - p1Head.x);
                    if (gameSettings.wallMode === 'wrap' && dX_p1 > tileCountX / 2) dX_p1 = tileCountX - dX_p1;
                    let dY_p1 = Math.abs(checkY - p1Head.y);
                    if (gameSettings.wallMode === 'wrap' && dY_p1 > tileCountY / 2) dY_p1 = tileCountY - dY_p1;
                    const distToP1 = dX_p1 + dY_p1;
                    if (distToP1 <= 5) {
                        currentWeight -= (6 - distToP1) * 3000; // Steer away from large P1
                    }
                }

                safeMoves.push({ ...move, weight: currentWeight });
            }

            let chosenMove;
            if (safeMoves.length > 0) { 
                if (aiSnakeObject.aiType === 5 && aiSnakeObject.preferredTurnDirection) { 
                    safeMoves.forEach(m => { 
                        const t = getTurnType(aiSnakeObject.lastDirection, m); 
                        if (aiSnakeObject.preferredTurnDirection === 'left' && t === 'L') m.weight *= 1.5; 
                        else if (aiSnakeObject.preferredTurnDirection === 'right' && t === 'R') m.weight *= 1.5; 
                        else if ((aiSnakeObject.preferredTurnDirection === 'left' && t === 'R') || (aiSnakeObject.preferredTurnDirection === 'right' && t === 'L')) m.weight *= 0.5;
                    });
                }
                safeMoves.sort((a, b) => b.weight - a.weight); 
                chosenMove = safeMoves[0];

                if (aiSnakeObject.aiType === 4 && chosenMove) { 
                    const bestMoveIsStraight = getTurnType(aiSnakeObject.lastDirection, chosenMove) === 'F'; 
                    if (bestMoveIsStraight) { 
                        for (let i = 1; i < safeMoves.length; i++) { 
                            const altMove = safeMoves[i]; 
                            const altMoveIsTurn = getTurnType(aiSnakeObject.lastDirection, altMove) === 'L' || getTurnType(aiSnakeObject.lastDirection, altMove) === 'R'; 
                            if (altMoveIsTurn && altMove.weight >= chosenMove.weight * 0.8) { 
                                chosenMove = altMove; 
                                break; 
                            }
                        }
                    }
                }
                if (aiSnakeObject.aiType === 2 && Math.random() < 0.25 && safeMoves.length > 1 && Math.random() < 0.5) {
                    chosenMove = safeMoves[1];
                }
            } else { 
                chosenMove = { dx: aiSnakeObject.lastDirection.dx, dy: aiSnakeObject.lastDirection.dy }; 
            }

            const actualTurnType = getTurnType(aiSnakeObject.lastDirection, chosenMove);
            if (actualTurnType !== 'U' && actualTurnType !== 'B') { 
                aiSnakeObject.turnHistory.push(actualTurnType); 
                if (aiSnakeObject.turnHistory.length > 5) aiSnakeObject.turnHistory.shift(); 
            }
            aiSnakeObject.lastDirection = { ...chosenMove }; 
            aiSnakeObject.dx = chosenMove.dx; 
            aiSnakeObject.dy = chosenMove.dy;
        }

        function checkCollisions(snake, otherSnakesArray) { 
            if (!snake || !snake.isAlive) return; 
            const head = snake.body[0];

            // Self collision
            for (let i = 1; i < snake.body.length; i++) { 
                if (head.x === snake.body[i].x && head.y === snake.body[i].y) { 
                    snake.isAlive = false; 
                    snake.finalLength = snake.body.length; 
                    spawnExplosion(head.x, head.y, snake.color, 22);
                    playSound('die');
                    if(currentGameMode === 'BATTLE') convertToFood(snake); 
                    return; 
                } 
            }

            // Other snakes collision
            for (const other of otherSnakesArray) {
                if (!other || !other.isAlive || other === snake) continue;
                for (let i = 0; i < other.body.length; i++) {
                    if (head.x === other.body[i].x && head.y === other.body[i].y) {
                        snake.isAlive = false; 
                        snake.finalLength = snake.body.length; 
                        spawnExplosion(head.x, head.y, snake.color, 22);
                        playSound('die');
                        if (currentGameMode === 'BATTLE') convertToFood(snake);
                        if (i === 0) { 
                             other.isAlive = false; 
                             other.finalLength = other.body.length; 
                             spawnExplosion(other.body[0].x, other.body[0].y, other.color, 22);
                             if (currentGameMode === 'BATTLE') convertToFood(other);
                        } 
                        return;
                    }
                }
            }
        }

        function convertToFood(deadSnake) { 
            if (!deadSnake || !deadSnake.body) return;
            const foodColor = levelFoodColors[(currentLevel - 1) % levelFoodColors.length];
            deadSnake.body.forEach(segment => {
                if (!foods.some(f => f.x === segment.x && f.y === segment.y)) {
                    foods.push({ x: segment.x, y: segment.y, color: foodColor });
                }
            });
        }

        function placeNewFoodItem() { 
            const targetFoodCount = currentMinFoodItems;
            while (foods.length < targetFoodCount) {
                const foodColor = levelFoodColors[(currentLevel - 1) % levelFoodColors.length];
                let newFood = { x: 0, y: 0, color: foodColor }; 
                let validPosition = false; 
                let attempts = 0; 
                const maxAttempts = tileCountX * tileCountY * 2; 
                while (!validPosition && attempts < maxAttempts) {
                    attempts++; 
                    newFood.x = Math.floor(Math.random() * tileCountX); 
                    newFood.y = Math.floor(Math.random() * tileCountY);
                    validPosition = true;
                    for (const f of foods) { 
                        if (f.x === newFood.x && f.y === newFood.y) { 
                            validPosition = false; 
                            break; 
                        } 
                    }
                    if (!validPosition) continue;
                    for (const s_ of snakes) { 
                        if (s_ && s_.isAlive && s_.body) { 
                            for (const seg of s_.body) { 
                                if (seg.x === newFood.x && seg.y === newFood.y) { 
                                    validPosition = false; 
                                    break; 
                                } 
                            } 
                        }
                        if (!validPosition) break;
                    }
                }
                if (validPosition) { 
                    foods.push(newFood); 
                } else { 
                    console.warn("Could not place new food item after max attempts."); 
                    break; 
                } 
            }
        }

        function drawGame() { 
            try {
                if (!ctx || !canvas) return;
                ctx.fillStyle = 'rgba(15, 15, 26, 0.65)'; 
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Optional subtle grid pattern
                ctx.fillStyle = 'rgba(255, 255, 255, 0.02)';
                for (let gx = 0; gx < tileCountX; gx += 2) {
                    for (let gy = 0; gy < tileCountY; gy += 2) {
                        ctx.fillRect(gx * gridSize, gy * gridSize, 1, 1);
                    }
                }

                if (!snakes) return;

                // Draw Snakes
                snakes.forEach(snake => {
                    if (snake && snake.isAlive && snake.body && snake.color) { 
                        for (let i = 0; i < snake.body.length; i++) {
                            const s = snake.body[i];
                            const o = Math.max(0.35, 1 - (i * 0.055));
                            ctx.fillStyle = i === 0 ? snake.color : `rgba(${hexToRgb(snake.color).r},${hexToRgb(snake.color).g},${hexToRgb(snake.color).b},${o})`;
                            
                            if (i === 0) { 
                                ctx.shadowBlur = 14; 
                                ctx.shadowColor = snake.color; 
                            }

                            // Rounded segment rendering
                            const pad = 1;
                            const segSize = gridSize - (pad * 2);
                            const rx = s.x * gridSize + pad;
                            const ry = s.y * gridSize + pad;
                            const rad = i === 0 ? Math.min(6, segSize / 2) : Math.min(4, segSize / 3);

                            if (ctx.roundRect) {
                                ctx.beginPath();
                                ctx.roundRect(rx, ry, segSize, segSize, rad);
                                ctx.fill();
                            } else {
                                ctx.fillRect(rx, ry, segSize, segSize);
                            }
                            ctx.shadowBlur = 0;

                            // Draw expressive eyes on the head
                            if (i === 0) {
                                const hx = s.x * gridSize + gridSize / 2;
                                const hy = s.y * gridSize + gridSize / 2;
                                const eyeRadius = Math.max(1.5, gridSize * 0.13);
                                const eyeOffset = gridSize * 0.24;
                                let eye1 = { x: hx, y: hy };
                                let eye2 = { x: hx, y: hy };
                                if (snake.dx === 1) { 
                                    eye1 = { x: hx + eyeOffset, y: hy - eyeOffset };
                                    eye2 = { x: hx + eyeOffset, y: hy + eyeOffset };
                                } else if (snake.dx === -1) { 
                                    eye1 = { x: hx - eyeOffset, y: hy - eyeOffset };
                                    eye2 = { x: hx - eyeOffset, y: hy + eyeOffset };
                                } else if (snake.dy === 1) { 
                                    eye1 = { x: hx - eyeOffset, y: hy + eyeOffset };
                                    eye2 = { x: hx + eyeOffset, y: hy + eyeOffset };
                                } else { 
                                    eye1 = { x: hx - eyeOffset, y: hy - eyeOffset };
                                    eye2 = { x: hx + eyeOffset, y: hy - eyeOffset };
                                }
                                ctx.fillStyle = '#FFFFFF';
                                ctx.beginPath(); ctx.arc(eye1.x, eye1.y, eyeRadius, 0, Math.PI * 2); ctx.fill();
                                ctx.beginPath(); ctx.arc(eye2.x, eye2.y, eyeRadius, 0, Math.PI * 2); ctx.fill();
                                ctx.fillStyle = '#0f0f1a';
                                ctx.beginPath(); ctx.arc(eye1.x + (snake.dx * 0.5), eye1.y + (snake.dy * 0.5), eyeRadius * 0.55, 0, Math.PI * 2); ctx.fill();
                                ctx.beginPath(); ctx.arc(eye2.x + (snake.dx * 0.5), eye2.y + (snake.dy * 0.5), eyeRadius * 0.55, 0, Math.PI * 2); ctx.fill();
                            }
                        }
                    }
                });

                // Draw Food items with pulsing glow
                foods.forEach(food => { 
                    const pulseFactor = Math.abs(Math.sin(Date.now() / 200)) * 0.16 + 0.84; 
                    const radius = (gridSize / 2.2) * pulseFactor; 
                    const centerX = food.x * gridSize + gridSize / 2;
                    const centerY = food.y * gridSize + gridSize / 2;
                    ctx.fillStyle = food.color; 
                    ctx.shadowBlur = 14; 
                    ctx.shadowColor = food.color;
                    ctx.beginPath(); 
                    ctx.arc(centerX, centerY, Math.max(2, radius), 0, Math.PI * 2); 
                    ctx.fill();
                    ctx.shadowBlur = 0;
                });

                // Update & Render Particles
                updateAndDrawParticles();

            } catch (error) { 
                console.error("Error in drawGame:", error); 
                if (gameInterval) clearInterval(gameInterval); 
            }
        }

        // --- Input Handling ---
        function handleKeyDown(e) { 
            const key = e.key.toLowerCase();
            const gameKeys = ['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '];
            if (gameKeys.includes(key)) {
                // Prevent browser page scrolling during gameplay
                if (canvas && canvas.style.display === 'block') {
                    e.preventDefault();
                }
            }

            if (!snakes || snakes.length === 0 || !snakes[0]) return;
            if (key === ' ') { 
                togglePauseGame(); 
                return;
            }
            
            // Player 1 controls
            if (key === 'w') queueDirection(0, 0, -1);
            else if (key === 's') queueDirection(0, 0, 1);
            else if (key === 'a') queueDirection(0, -1, 0);
            else if (key === 'd') queueDirection(0, 1, 0);
            else if (currentGameMode === 'AI' || currentGameMode === 'BATTLE') {
                if (key === 'arrowup') queueDirection(0, 0, -1);
                else if (key === 'arrowdown') queueDirection(0, 0, 1);
                else if (key === 'arrowleft') queueDirection(0, -1, 0);
                else if (key === 'arrowright') queueDirection(0, 1, 0);
            }

            // Player 2 controls in 2P mode
            if (currentGameMode === '2P') {
                if (key === 'arrowup') queueDirection(1, 0, -1);
                else if (key === 'arrowdown') queueDirection(1, 0, 1);
                else if (key === 'arrowleft') queueDirection(1, -1, 0);
                else if (key === 'arrowright') queueDirection(1, 1, 0);
            }
        }

        // Touch Input
        let activeTouches = {}; 
        const swipeThreshold = 25; 
        if (canvas) {
            canvas.addEventListener('touchstart', function(e) {
                e.preventDefault(); 
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    const touchZonePlayer = (currentGameMode === '2P' && touch.clientY < canvas.height / 2) ? 2 : 1;
                    activeTouches[touch.identifier] = { startX: touch.clientX, startY: touch.clientY, player: touchZonePlayer };
                }
            }, { passive: false });

            canvas.addEventListener('touchend', function(e) {
                e.preventDefault();
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    const touchData = activeTouches[touch.identifier];
                    if (touchData) {
                        const deltaX = touch.clientX - touchData.startX;
                        const deltaY = touch.clientY - touchData.startY;
                        const playerIndex = (currentGameMode === '2P' && touchData.player === 2) ? 1 : 0;
                        handleSwipe(deltaX, deltaY, playerIndex);
                        delete activeTouches[touch.identifier];
                    }
                }
            }, { passive: false });
        }

        function handleSwipe(deltaX, deltaY, playerIndex) { 
            if (Math.abs(deltaX) > swipeThreshold || Math.abs(deltaY) > swipeThreshold) { 
                if (Math.abs(deltaX) > Math.abs(deltaY)) { 
                    if (deltaX > 0) queueDirection(playerIndex, 1, 0);
                    else queueDirection(playerIndex, -1, 0);
                } else { 
                    if (deltaY > 0) queueDirection(playerIndex, 0, 1);
                    else queueDirection(playerIndex, 0, -1);
                }
            }
        }

        // Touch D-Pad Click/Touch Bindings
        function setupDpad() {
            const bindBtn = (el, dx, dy) => {
                if (!el) return;
                const act = (e) => { e.preventDefault(); e.stopPropagation(); queueDirection(0, dx, dy); };
                el.addEventListener('touchstart', act, { passive: false });
                el.addEventListener('mousedown', act);
            };
            bindBtn(dpadUp, 0, -1);
            bindBtn(dpadDown, 0, 1);
            bindBtn(dpadLeft, -1, 0);
            bindBtn(dpadRight, 1, 0);
        }
        setupDpad();

        // --- Game Start/End Flow ---
        function startGame() { 
            try {
                playSound('click');
                isPaused = false; 
                titleScreen.style.display = 'none'; 
                gameOverScreen.style.display = 'none'; 
                if (exitBattleButton) exitBattleButton.style.display = 'none';
                
                if (currentGameMode === 'BATTLE') {
                    battleSnakeColors = generateSnakeColors(6);
                    window.activeP1Color = battleSnakeColors[0]; 
                } else {
                    const standardColors = generateSnakeColors(2);
                    window.activeP1Color = standardColors[0]; 
                    window.activeP2Color = standardColors[1];
                }

                if (window.nextP1Color && window.nextP2Color && currentGameMode !== 'BATTLE') {
                     window.activeP1Color = window.nextP1Color; 
                     window.activeP2Color = window.nextP2Color;
                } else if (window.nextP1Color && currentGameMode === 'BATTLE' && battleSnakeColors.length > 0) {
                     window.activeP1Color = battleSnakeColors[0]; 
                }
                window.nextP1Color = null; 
                window.nextP2Color = null; 

                if (playAIButton) playAIButton.style.backgroundColor = window.activeP1Color; 
                if (play2PButton) play2PButton.style.backgroundColor = window.activeP1Color; 
                if (playBattleButton) playBattleButton.style.backgroundColor = window.activeP1Color;
                
                const opponentUIColor = (currentGameMode === 'BATTLE') ? (battleSnakeColors[1] || '#FF69B4') : window.activeP2Color;
                if (titleH1) { 
                    titleH1.style.color = opponentUIColor; 
                    titleH1.style.textShadow = `0 0 10px ${opponentUIColor}, 0 0 20px ${opponentUIColor}`; 
                }
                
                resizeCanvas(); 
                
                // Border styling
                if (gameSettings.wallMode === 'solid') {
                    canvas.style.borderColor = '#ff4757';
                    canvas.style.borderWidth = '4px';
                } else {
                    canvas.style.borderTopColor = opponentUIColor; 
                    canvas.style.borderLeftColor = opponentUIColor;
                    canvas.style.borderRightColor = window.activeP1Color; 
                    canvas.style.borderBottomColor = window.activeP1Color;
                    canvas.style.borderWidth = '3px';
                }
                
                snakes = []; 
                if (currentGameMode === '2P') {
                     snakes[0] = { color: window.activeP1Color }; 
                     snakes[1] = { color: window.activeP2Color }; 
                     canvas.style.display = 'block'; 
                     show2PStartAnimation(() => { initGame(); });
                } else if (currentGameMode === 'BATTLE') {
                     snakes[0] = { color: battleSnakeColors[0] }; 
                     canvas.style.display = 'block'; 
                     showBattleStartAnimation(() => { initGame(); });
                } else { 
                     canvas.style.display = 'block'; 
                     initGame(); 
                }
            } catch (e) { 
                console.error("CRITICAL ERROR in startGame:", e); 
                if (gameInterval) clearInterval(gameInterval); 
            }
        }

        function togglePauseGame() {
            if (canvas.style.display !== 'block') return; 

            isPaused = !isPaused;
            playSound('pause');
            updateHud();

            if (isPaused) {
                if (gameInterval) clearInterval(gameInterval);
                gameInterval = null; 
                if (ctx && canvas) { 
                    ctx.fillStyle = "rgba(10, 10, 20, 0.7)";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.font = `bold ${clamp(canvas.width * 0.08, 30, 80)}px Arial`;
                    ctx.fillStyle = "white";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText("Paused", canvas.width / 2, canvas.height / 2);
                }
            } else {
                if (!gameInterval) gameInterval = setInterval(gameLoop, gameSpeed);
            }
        }

        function endGame() { 
            try {
                if (gameInterval) clearInterval(gameInterval); 
                gameInterval = null; 
                isPaused = false; 
                
                if (canvas) canvas.style.display = 'none';
                if (gameHud) gameHud.style.display = 'none';
                if (dpadContainer) dpadContainer.style.display = 'none';
                if (gameOverScreen) gameOverScreen.style.display = 'flex';
                if (exitBattleButton) exitBattleButton.style.display = 'none';

                if (recordText) recordText.style.display = 'none'; 
                if (rankingsDisplay) { 
                    rankingsDisplay.style.display = 'none'; 
                    rankingsDisplay.innerHTML = ''; 
                }

                if (currentGameMode === 'BATTLE') {
                    gameStats.battleTotal++;
                    if (snakes && snakes.forEach) {
                        snakes.forEach(s => { 
                            if (s && s.isAlive && s.body) s.finalLength = s.body.length; 
                            else if (s && !s.isAlive && s.finalLength === 0 && s.body) s.finalLength = s.body.length; 
                        }); 
                    }
                    if (snakes && snakes.sort) {
                        snakes.sort((a, b) => { 
                            if (!a && !b) return 0; if (!a) return 1; if (!b) return -1; 
                            if (a.isAlive !== b.isAlive) return b.isAlive - a.isAlive; 
                            return b.finalLength - a.finalLength; 
                        });
                    }
                    if (snakes && snakes.forEach) {
                        snakes.forEach((s, index) => { if (s) s.rank = index + 1; });
                    }

                    const p1Snake = snakes.find(s => s && s.name === "P1");
                    const p1Rank = p1Snake ? p1Snake.rank : 6;
                    if (p1Rank === 1) {
                        gameStats.battleWins++;
                        playSound('level');
                    }
                    if (!gameStats.bestBattleRank || p1Rank < gameStats.bestBattleRank) {
                        gameStats.bestBattleRank = p1Rank;
                    }
                    saveStats();

                    if (gameResultText) {
                        gameResultText.textContent = p1Rank === 1 ? "Victory Royale!" : `Battle Over! Rank: #${p1Rank}`;
                        gameResultText.style.color = p1Rank === 1 ? '#00ffea' : '#c0c0ff';
                    }

                    if (rankingsDisplay) {
                        rankingsDisplay.style.display = 'block';
                        let rankingsHTML = "<h3>Final Rankings:</h3>";
                        if (snakes && snakes.forEach) {
                            snakes.forEach(s => { 
                                if (s) { 
                                    const isP1 = s.name === "P1"; 
                                    rankingsHTML += `<p class="${isP1 ? 'player1-rank' : ''}" style="color:${s.color || '#FFFFFF'}"> 
                                                        #${s.rank} ${s.name || 'Snake'} (Length: ${s.finalLength || 0}) ${s.isAlive ? '[Survived!]' : '[Eliminated]'} 
                                                     </p>`; 
                                }
                            });
                        }
                        rankingsDisplay.innerHTML = rankingsHTML;
                    }
                } else { 
                    if (recordText) recordText.style.display = 'block';
                    const p1 = snakes[0]; 
                    const opponent = snakes[1]; 
                    let p1Alive = p1 && p1.isAlive; 
                    let opponentAlive = opponent && opponent.isAlive;

                    const p1Length = (p1 && p1.isAlive && p1.body) ? p1.body.length : ((p1 && p1.finalLength) ? p1.finalLength : 0);
                    const opponentLength = (opponent && opponent.isAlive && opponent.body) ? opponent.body.length : ((opponent && opponent.finalLength) ? opponent.finalLength : 0);
                    const opponentName = (opponent && opponent.name) ? opponent.name : (currentGameMode === 'AI' ? "AI" : "Player 2");

                    let resultMessage = "";
                    let winnerColor = '#e0e0e0';

                    if (!p1Alive && opponentAlive) { 
                        p2Wins++; 
                        resultMessage = (currentGameMode === 'AI' ? `${opponentName} Wins!` : 'Player 2 Wins!');
                        winnerColor = opponent ? opponent.color : '#FFFFFF';
                        if (currentGameMode === 'AI') {
                            gameStats.vsAiLosses++;
                            gameStats.currentAiStreak = 0;
                            saveStats();
                        } else {
                            gameStats.p2P2Wins++;
                            saveStats();
                        }
                    } else if (p1Alive && !opponentAlive) { 
                        p1Wins++; 
                        resultMessage = 'Player 1 Wins!';
                        winnerColor = p1 ? p1.color : '#FFFFFF';
                        playSound('level');
                        if (currentGameMode === 'AI') {
                            gameStats.vsAiWins++;
                            gameStats.currentAiStreak++;
                            if (gameStats.currentAiStreak > gameStats.bestAiStreak) {
                                gameStats.bestAiStreak = gameStats.currentAiStreak;
                            }
                            saveStats();
                        } else {
                            gameStats.p2P1Wins++;
                            saveStats();
                        }
                    } else { 
                        resultMessage = "It's a Tie!";
                    }

                    if (gameResultText) {
                        gameResultText.textContent = resultMessage;
                        gameResultText.style.color = winnerColor;
                    }
                    if (recordText) { 
                        recordText.innerHTML = `Player 1 (Length: ${p1Length}): ${p1Wins}<br>${opponentName} (Length: ${opponentLength}): ${p2Wins}`; 
                    }
                }
                
                const nextColors = generateSnakeColors(2); 
                window.nextP1Color = nextColors[0]; 
                window.nextP2Color = nextColors[1];
                
                // Initialize Game Over mode selector to current game mode
                selectedGameOverMode = currentGameMode;
                updateGameOverModeUI();

                refreshTitleStats();

            } catch (e) { 
                console.error("CRITICAL ERROR in endGame:", e); 
            }
        }

        // --- Settings Modal & Toggles ---
        function openSettings() {
            playSound('click');
            if (settingsModal) settingsModal.style.display = 'flex';
            updateSettingsUI();
        }

        function closeSettings() {
            playSound('click');
            if (settingsModal) settingsModal.style.display = 'none';
            if (dpadContainer && canvas.style.display === 'block') {
                dpadContainer.style.display = gameSettings.showDpad ? 'grid' : 'none';
            }
            saveSettings();
        }

        function updateSettingsUI() {
            if (wallWrapBtn && wallSolidBtn) {
                wallWrapBtn.classList.toggle('active', gameSettings.wallMode === 'wrap');
                wallSolidBtn.classList.toggle('active', gameSettings.wallMode === 'solid');
            }
            if (soundOnBtn && soundOffBtn) {
                soundOnBtn.classList.toggle('active', gameSettings.soundEnabled);
                soundOffBtn.classList.toggle('active', !gameSettings.soundEnabled);
            }
            if (dpadOnBtn && dpadOffBtn) {
                dpadOnBtn.classList.toggle('active', gameSettings.showDpad);
                dpadOffBtn.classList.toggle('active', !gameSettings.showDpad);
            }
            if (quickSoundToggleBtn) {
                quickSoundToggleBtn.textContent = gameSettings.soundEnabled ? '🔊 Sound: On' : '🔇 Sound: Off';
            }
            if (hudAudioBtn) {
                hudAudioBtn.textContent = gameSettings.soundEnabled ? '🔊' : '🔇';
            }
        }

        function refreshTitleStats() {
            if (statBestRank) statBestRank.textContent = gameStats.bestBattleRank ? `#${gameStats.bestBattleRank}` : '-';
            if (statAiStreak) statAiStreak.textContent = gameStats.bestAiStreak || 0;
            if (statLongest) statLongest.textContent = gameStats.longestSnake || 0;
        }

        // Settings Listeners
        if (openSettingsBtn) openSettingsBtn.addEventListener('click', openSettings);
        if (gameOverSettingsBtn) gameOverSettingsBtn.addEventListener('click', openSettings);
        if (closeSettingsBtn) closeSettingsBtn.addEventListener('click', closeSettings);
        
        if (wallWrapBtn) wallWrapBtn.addEventListener('click', () => { gameSettings.wallMode = 'wrap'; playSound('click'); updateSettingsUI(); saveSettings(); });
        if (wallSolidBtn) wallSolidBtn.addEventListener('click', () => { gameSettings.wallMode = 'solid'; playSound('click'); updateSettingsUI(); saveSettings(); });
        
        if (soundOnBtn) soundOnBtn.addEventListener('click', () => { gameSettings.soundEnabled = true; playSound('click'); updateSettingsUI(); saveSettings(); });
        if (soundOffBtn) soundOffBtn.addEventListener('click', () => { gameSettings.soundEnabled = false; updateSettingsUI(); saveSettings(); });

        if (dpadOnBtn) dpadOnBtn.addEventListener('click', () => { gameSettings.showDpad = true; playSound('click'); updateSettingsUI(); saveSettings(); });
        if (dpadOffBtn) dpadOffBtn.addEventListener('click', () => { gameSettings.showDpad = false; playSound('click'); updateSettingsUI(); saveSettings(); });

        if (quickSoundToggleBtn) quickSoundToggleBtn.addEventListener('click', () => {
            gameSettings.soundEnabled = !gameSettings.soundEnabled;
            playSound('click');
            updateSettingsUI();
            saveSettings();
        });

        if (hudPauseBtn) hudPauseBtn.addEventListener('click', togglePauseGame);
        if (hudAudioBtn) hudAudioBtn.addEventListener('click', () => {
            gameSettings.soundEnabled = !gameSettings.soundEnabled;
            playSound('click');
            updateSettingsUI();
            saveSettings();
        });

        if (resetStatsBtn) resetStatsBtn.addEventListener('click', () => {
            if (confirm("Reset all saved game stats?")) {
                gameStats = {
                    vsAiWins: 0, vsAiLosses: 0, currentAiStreak: 0, bestAiStreak: 0,
                    p2P1Wins: 0, p2P2Wins: 0, battleTotal: 0, battleWins: 0,
                    bestBattleRank: null, longestSnake: 0
                };
                saveStats();
                refreshTitleStats();
                playSound('click');
            }
        });

        // Title Screen Mode Selection Listeners
        if (playAIButton) playAIButton.addEventListener('click', () => { 
            if (currentGameMode !== 'AI' || currentGameMode === 'BATTLE') { p1Wins = 0; p2Wins = 0; } 
            currentGameMode = 'AI'; 
            startGame(); 
        });
        if (play2PButton) play2PButton.addEventListener('click', () => { 
            if (currentGameMode !== '2P' || currentGameMode === 'BATTLE') { p1Wins = 0; p2Wins = 0; } 
            currentGameMode = '2P'; 
            startGame(); 
        });
        if (playBattleButton) playBattleButton.addEventListener('click', () => { 
            currentGameMode = 'BATTLE'; 
            startGame(); 
        });

        // Game Over Mode Selection & Start Listeners
        if (gameOverSelectAI) gameOverSelectAI.addEventListener('click', () => {
            selectedGameOverMode = 'AI';
            playSound('click');
            updateGameOverModeUI();
        });
        if (gameOverSelect2P) gameOverSelect2P.addEventListener('click', () => {
            selectedGameOverMode = '2P';
            playSound('click');
            updateGameOverModeUI();
        });
        if (gameOverSelectBattle) gameOverSelectBattle.addEventListener('click', () => {
            selectedGameOverMode = 'BATTLE';
            playSound('click');
            updateGameOverModeUI();
        });

        if (gameOverStartButton) gameOverStartButton.addEventListener('click', () => {
            if (currentGameMode !== selectedGameOverMode) {
                p1Wins = 0; 
                p2Wins = 0; 
                currentGameMode = selectedGameOverMode;
            }
            startGame();
        });

        if (gameOverHomeBtn) gameOverHomeBtn.addEventListener('click', () => {
            playSound('click');
            if (gameOverScreen) gameOverScreen.style.display = 'none';
            if (titleScreen) titleScreen.style.display = 'flex';
            refreshTitleStats();
        });

        if (exitBattleButton) exitBattleButton.addEventListener('click', () => {
            if (currentGameMode === 'BATTLE' && snakes && snakes.length > 0 && snakes[0] && !snakes[0].isAlive) {
                endGame();
            }
        });

        window.addEventListener('resize', () => { 
            resizeCanvas(); 
            if (canvas && canvas.style.display === 'block' && gameInterval) { 
                drawGame(); 
            } 
        });
        document.addEventListener('keydown', handleKeyDown);

        // --- App Initialization ---
        function initializeApp() { 
            console.log("[DEBUG] Initializing app v1.5...");
            if (!canvas || !ctx) { 
                console.error("Canvas or context not found!"); 
                return; 
            }
            const initialColors = generateSnakeColors(2);
            window.nextP1Color = initialColors[0]; 
            window.nextP2Color = initialColors[1];
            if (playAIButton) playAIButton.style.backgroundColor = window.nextP1Color;
            if (play2PButton) play2PButton.style.backgroundColor = window.nextP1Color; 
            if (playBattleButton) playBattleButton.style.backgroundColor = window.nextP1Color;
            if (titleH1) {
                titleH1.style.color = window.nextP2Color;
                titleH1.style.textShadow = `0 0 10px ${window.nextP2Color}, 0 0 20px ${window.nextP2Color}`;
            }
            if (titleScreen) titleScreen.style.display = 'flex';
            if (gameOverScreen) gameOverScreen.style.display = 'none';
            if (canvas) canvas.style.display = 'none';
            if (gameHud) gameHud.style.display = 'none';
            if (dpadContainer) dpadContainer.style.display = 'none';
            if (exitBattleButton) exitBattleButton.style.display = 'none';
            if (recordText) recordText.textContent = `Player 1: ${p1Wins} - AI: ${p2Wins}`; 
            
            updateSettingsUI();
            refreshTitleStats();
            resizeCanvas(); 
            console.log("[DEBUG] App v1.5 initialized successfully.");
        }

        try {
            initializeApp();
        } catch(e) {
            console.error("CRITICAL ERROR during initializeApp:", e);
        }
    </script>
</body>
</html>
